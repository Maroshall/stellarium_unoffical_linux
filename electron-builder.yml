appId: kr.stellarium.app

productName: 스텔라리움

copyright: Copyright © 2026 Stellarium

directories:
  output: dist
  buildResources: build

files:
  - "**/*"
  - "!**/*.md"
  - "!**/*.txt"

asar: true

linux:
  target:
    - AppImage
  category: Utility
  mimeTypes:
    - x-scheme-handler/stellarium

  artifactName: "${productName}-${version}.${ext}"

publish:
  provider: github
